name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar
        run: |
          set +e
          mvn -B clean package 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E '^\[ERROR\]' build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
          exit $status

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: FloorIsLava-jar
          path: target/FloorIsLava-*.jar
