name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar
        run: mvn -B clean package

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: FloorIsLava-jar
          path: target/FloorIsLava-*.jar
