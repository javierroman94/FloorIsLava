# ============================================================
#  Floor Is Lava - configuración
#  Los colores usan el formato &a, &c, etc.
# ============================================================

# Segundos entre cada subida de lava para cada preset de velocidad.
# CUSTOM usa el intervalo propio de cada arena (se cambia desde la GUI).
speed:
  LENTA: 20.0
  NORMAL: 10.0
  RAPIDA: 5.0

# Dificultad: segundos de gracia antes de que empiece la lava
# y número de capas que sube la lava en cada paso.
difficulty:
  FACIL:
    grace-seconds: 30
    layers-per-step: 1
  NORMAL:
    grace-seconds: 15
    layers-per-step: 1
  DIFICIL:
    grace-seconds: 5
    layers-per-step: 2

lava:
  # Si el TPS del servidor baja de este valor, la lava no añade capas nuevas
  # hasta que se recupere. Por encima, la velocidad se ajusta de forma dinámica.
  tps-pause-below: 15.0

restore:
  # instant  = restaura todo de golpe
  # gradual  = restaura por tandas (anti-lag)
  mode: gradual
  blocks-per-tick: 2500

end:
  # Segundos que se muestra el TOP 3 / holograma antes de devolver a los jugadores
  delay-seconds: 10

border:
  # Muestra un WorldBorder visual (solo para los jugadores de la partida)
  visual: true

gui:
  title: "&6&lFloor Is Lava &8- &7Configuración"

sounds:
  enabled: true
  events:
    countdown:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_HAT
      volume: 1.0
      pitch: 1.0
    start:
      enabled: true
      sound: ENTITY_ENDER_DRAGON_GROWL
      volume: 0.6
      pitch: 1.0
    lava-rise:
      enabled: true
      sound: ITEM_BUCKET_EMPTY_LAVA
      volume: 0.4
      pitch: 0.8
    elimination:
      enabled: true
      sound: ENTITY_LIGHTNING_BOLT_THUNDER
      volume: 0.7
      pitch: 1.0
    win:
      enabled: true
      sound: UI_TOAST_CHALLENGE_COMPLETE
      volume: 1.0
      pitch: 1.0

titles:
  countdown:
    enabled: true
    title: "&e{seconds}"
    subtitle: "&7La lava se acerca..."
    fade-in: 0
    stay: 15
    fade-out: 5
  start:
    enabled: true
    title: "&c&l¡LA LAVA SUBE!"
    subtitle: "&7Sobrevive el mayor tiempo posible"
    fade-in: 5
    stay: 40
    fade-out: 10
  elimination:
    enabled: true
    title: "&c&lELIMINADO"
    subtitle: "&7Quedaste en el puesto #{place}"
    fade-in: 5
    stay: 50
    fade-out: 10
  win:
    enabled: true
    title: "&6&l¡VICTORIA!"
    subtitle: "&7Eres el último en pie"
    fade-in: 5
    stay: 80
    fade-out: 20

